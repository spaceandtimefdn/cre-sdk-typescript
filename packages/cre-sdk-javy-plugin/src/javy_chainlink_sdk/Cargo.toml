[package]
name = "javy_chainlink_sdk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
javy-plugin-api = "3.1.0"
javy = "4.0.0"
serde_json = "1.0"
base64 = "0.21"
rand = "0.8"
rand_chacha = "0.3"

proof-of-sql = { version="0.127.27", default-features = false, features = ["hyperkzg_proof"] }
nova-snark = { version = "0.41.0", default-features = false }
uuid = { version = "=1.12.1", default-features = false, features=["serde"] }
serde = { version = "1.0", features = ["serde_derive"] }
prost = "0.12"
indexmap = "2.8.0"
hex = { version = "0.4.3", default-features = false, features = ["serde"] }
sqlparser = { version = "0.45.0", default-features = false }
itertools = "0.13.0"
snafu = { version = "0.8.5", default-features = false }
eth_merkle_tree = "0.1.3"
k256 = { version = "0.13.4" }
sha3 = { version = "0.10.8" }